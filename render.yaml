services:
  # ── 1. The FastAPI Backend (FREE TIER) ──────────────
  - type: web
    name: supportplus-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  # ── 2. The Streamlit Frontend UI (FREE TIER) ────────
  - type: web
    name: supportplus-ui
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run ui.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: SUPPORTPLUS_API_URL
        fromService:
          type: web
          name: supportplus-backend
          envVarKey: RENDER_EXTERNAL_URL
